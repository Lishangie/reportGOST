name: Сборка примеров

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer fonts-liberation
          python -m pip install -q -r requirements.txt
      - name: Сборка примеров (LibreOffice)
        # Проверка, что сборщик отрабатывает без ошибок. Точная вёрстка проверяется
        # в Word на Windows (Проверка.bat): LibreOffice разбивает страницы иначе.
        run: |
          set -e
          for f in примеры/*/report.md; do
            echo "== $f"
            python build.py "$f" --pdf
            ls "$(dirname "$f")"/*.docx "$(dirname "$f")"/*.pdf
          done
      - uses: actions/upload-artifact@v4
        with:
          name: примеры
          path: |
            примеры/*/*.docx
            примеры/*/*.pdf
